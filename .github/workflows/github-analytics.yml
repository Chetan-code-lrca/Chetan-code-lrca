name: Update profile analytics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/github-analytics.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate dark stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=Chetan-code-lrca&show_icons=true&hide_border=true&theme=github_dark"
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=Chetan-code-lrca&show_icons=true&hide_border=true&theme=default"
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark top-languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=Chetan-code-lrca&layout=compact&langs_count=6&hide_border=true&theme=github_dark"
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light top-languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=Chetan-code-lrca&layout=compact&langs_count=6&hide_border=true&theme=default"
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: "user=Chetan-code-lrca&theme=dark&hide_border=true&disable_animations=true"
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light streak card
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: "user=Chetan-code-lrca&theme=default&hide_border=true&disable_animations=true"
          path: profile/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --quiet --cached || { git commit -m "chore: refresh profile analytics"; git push; }
