name: Generate contribution snake

on:
  schedule:
    # Primary daily refresh — 00:37 UTC (06:07 IST)
    - cron: "37 0 * * *"
    # Same-day recovery run — 14:47 UTC (20:17 IST)
    - cron: "47 14 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate light and dark snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Chetan-code-lrca
          outputs: |
            profile/github-snake.svg?palette=github-light
            profile/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/github-snake.svg profile/github-snake-dark.svg
          git diff --quiet --cached || { git commit -m "chore: refresh contribution snake"; git push; }
