<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Chetan's engineering lab console">
  <defs>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    </style>
  </defs>
  <rect width="1000" height="250" rx="18" fill="#0d1117" stroke="#30363d"/>
  <text x="30" y="32" class="m" fill="#8b949e" font-size="13">lab@chetan:~/signals</text>
  <text x="30" y="68" class="m" fill="#58a6ff" font-size="14">$ ls --group-by=domain</text>

  <g class="m" font-size="14">
    <text x="30" y="96" fill="#7ee787">security/</text>
    <text x="120" y="96" fill="#e6edf3">NetraX</text>
    <text x="300" y="96" fill="#e6edf3">PhishGuard AI</text>

    <text x="30" y="124" fill="#d2a8ff">ai/</text>
    <text x="120" y="124" fill="#e6edf3">AI Study Coach</text>
    <text x="300" y="124" fill="#e6edf3">SkillSling AI</text>

    <text x="30" y="152" fill="#58a6ff">apps/</text>
    <text x="120" y="152" fill="#e6edf3">FitMatch AI</text>
    <text x="300" y="152" fill="#e6edf3">GreenMile</text>

    <text x="30" y="180" fill="#f2cc60">vision/</text>
    <text x="120" y="180" fill="#e6edf3">Low-Level Image Features</text>
  </g>

  <text x="30" y="218" class="m" fill="#58a6ff" font-size="14">$ echo $PRINCIPLE</text>
  <text x="195" y="218" class="m" fill="#e6edf3" font-size="14">build → understand → improve</text>
  <rect x="465" y="203" width="2" height="22" fill="#7ee787">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>

  <circle cx="925" cy="42" r="4" fill="#7ee787">
    <animate attributeName="r" values="4;6;4" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="942" y="47" class="m" fill="#8b949e" font-size="11">live</text>
</svg>