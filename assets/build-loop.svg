<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Animated engineering build loop">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset=".5" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#d2a8ff"/>
    </linearGradient>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
    </style>
  </defs>
  <rect width="1000" height="210" rx="18" fill="#0d1117" stroke="#30363d"/>
  <text x="34" y="36" class="m" fill="#8b949e" font-size="13">$ ./build-loop --watch</text>

  <path d="M90 104 H910" stroke="#30363d" stroke-width="5" stroke-linecap="round"/>
  <path d="M90 104 H910" stroke="url(#line)" stroke-width="2" stroke-linecap="round" stroke-dasharray="12 16">
    <animate attributeName="stroke-dashoffset" values="0;-56" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <g class="m" text-anchor="middle">
    <g>
      <circle cx="100" cy="104" r="25" fill="#161b22" stroke="#58a6ff"/>
      <text x="100" y="109" fill="#e6edf3" font-size="11">ASK</text>
      <text x="100" y="156" fill="#8b949e" font-size="12">question</text>
    </g>
    <g>
      <circle cx="260" cy="104" r="25" fill="#161b22" stroke="#58a6ff"/>
      <text x="260" y="109" fill="#e6edf3" font-size="11">READ</text>
      <text x="260" y="156" fill="#8b949e" font-size="12">research</text>
    </g>
    <g>
      <circle cx="420" cy="104" r="25" fill="#161b22" stroke="#7ee787"/>
      <text x="420" y="109" fill="#e6edf3" font-size="11">MAKE</text>
      <text x="420" y="156" fill="#8b949e" font-size="12">prototype</text>
    </g>
    <g>
      <circle cx="580" cy="104" r="25" fill="#161b22" stroke="#7ee787"/>
      <text x="580" y="109" fill="#e6edf3" font-size="11">BREAK</text>
      <text x="580" y="156" fill="#8b949e" font-size="12">test</text>
    </g>
    <g>
      <circle cx="740" cy="104" r="25" fill="#161b22" stroke="#d2a8ff"/>
      <text x="740" y="109" fill="#e6edf3" font-size="11">LEARN</text>
      <text x="740" y="156" fill="#8b949e" font-size="12">understand</text>
    </g>
    <g>
      <circle cx="900" cy="104" r="25" fill="#161b22" stroke="#d2a8ff"/>
      <text x="900" y="109" fill="#e6edf3" font-size="11">SHIP</text>
      <text x="900" y="156" fill="#8b949e" font-size="12">improve</text>
    </g>
  </g>

  <circle cx="100" cy="104" r="5" fill="#ffffff">
    <animate attributeName="cx" values="100;260;420;580;740;900;100" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#58a6ff;#58a6ff;#7ee787;#7ee787;#d2a8ff;#d2a8ff;#58a6ff" dur="6s" repeatCount="indefinite"/>
  </circle>

  <text x="500" y="193" class="m" text-anchor="middle" fill="#8b949e" font-size="12">The lab is the process, not just the finished repository.</text>
</svg>